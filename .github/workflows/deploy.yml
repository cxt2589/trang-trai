name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to Cloudflare
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies & Build
        working-directory: dashboard
        run: |
          npm install
          npm run build

      - name: Deploy to Cloudflare
        working-directory: dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "### 🔍 Ket Qua Chan Doan Deploy" >> $GITHUB_STEP_SUMMARY
          [ -n "$CLOUDFLARE_API_TOKEN" ] && echo "- ✅ CLOUDFLARE_API_TOKEN: Da co gia tri" >> $GITHUB_STEP_SUMMARY || echo "- ⚠️ CLOUDFLARE_API_TOKEN: Dang trong (Chua co)" >> $GITHUB_STEP_SUMMARY
          [ -n "$CLOUDFLARE_API_KEY" ] && echo "- ✅ CLOUDFLARE_API_KEY: Da co gia tri" >> $GITHUB_STEP_SUMMARY || echo "- ⚠️ CLOUDFLARE_API_KEY: Dang trong (Chua co)" >> $GITHUB_STEP_SUMMARY
          [ -n "$CLOUDFLARE_EMAIL" ] && echo "- ✅ CLOUDFLARE_EMAIL: Da co ($CLOUDFLARE_EMAIL)" >> $GITHUB_STEP_SUMMARY || echo "- ⚠️ CLOUDFLARE_EMAIL: Dang trong (Chua co)" >> $GITHUB_STEP_SUMMARY
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && echo "- ✅ CLOUDFLARE_ACCOUNT_ID: Da co gia tri" >> $GITHUB_STEP_SUMMARY || echo "- ⚠️ CLOUDFLARE_ACCOUNT_ID: Dang trong (Chua co)" >> $GITHUB_STEP_SUMMARY

          echo "🚀 Dang chay npx wrangler deploy..."
          npx wrangler deploy > deploy_output.txt 2>&1 || {
            STATUS=$?
            echo "❌ Deploy that bai voi ma loi $STATUS"
            echo "#### 📝 Chi tiet loi tu Cloudflare:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat deploy_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat deploy_output.txt
            exit $STATUS
          }
          echo "✅ Deploy thanh cong!" >> $GITHUB_STEP_SUMMARY
          cat deploy_output.txt
