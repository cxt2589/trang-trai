name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to Cloudflare
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies & Build
        working-directory: dashboard
        run: |
          npm install
          npm run build

      - name: Deploy to Cloudflare
        working-directory: dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== Kiem tra Secrets trong moi truong GitHub Runner ==="
          [ -n "$CLOUDFLARE_API_TOKEN" ] && echo "-> CLOUDFLARE_API_TOKEN: DA CO GIA TRI" || echo "-> CLOUDFLARE_API_TOKEN: DANG TRONG (EMPTY)!"
          [ -n "$CLOUDFLARE_API_KEY" ] && echo "-> CLOUDFLARE_API_KEY: DA CO GIA TRI" || echo "-> CLOUDFLARE_API_KEY: DANG TRONG (EMPTY)!"
          [ -n "$CLOUDFLARE_EMAIL" ] && echo "-> CLOUDFLARE_EMAIL: DA CO GIA TRI ($CLOUDFLARE_EMAIL)" || echo "-> CLOUDFLARE_EMAIL: DANG TRONG (EMPTY)!"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && echo "-> CLOUDFLARE_ACCOUNT_ID: DA CO GIA TRI" || echo "-> CLOUDFLARE_ACCOUNT_ID: DANG TRONG (EMPTY)!"
          echo "=========================================================="
          npx wrangler deploy
