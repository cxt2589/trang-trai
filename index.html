    const ROADMAP = [

      {
        week: "Tuần 2",

      {
        week: "Tuần 3 - 4",

        tag: "Tận dụng tài nguyên",

        points: [

        ],

      },
      {
        week: "Tháng 2",
        phase: "Chăm Sóc & Vỗ Béo",
        tag: "Tăng trưởng",
        title: "Nuôi Thả Đồi Tự Nhiên & Hoàn Thiện Thịt Thơm Ngon",
        points: [
          "Gà 3T thả tự do sườn đồi từ 9h sáng bới tìm sâu bọ, tạo thớ thịt săn chắc, da giòn vàng.",
          "Chiều bổ sung thóc mầm ủ men giúp tiêu hóa tốt, tăng cân đều đặn không tích mỡ thừa.",
          "Đàn gà 1 tháng hoàn thiện khung xương thành gà giò, quen dần thời tiết rét."
        ],
        tip: "Kiểm tra gà hàng tuần, phân loại trống mái để chuẩn bị kênh xuất bán Tết."
      },
      {
        week: "Tháng 3 (Cận Tết)",
        phase: "Xuất Bán & Thu Hồi Vốn",
        tag: "Thu tiền mặt",
        title: "15 - 28 Chạp: Xuất Bán Thần Tốc, Vét Đàn 3T & Giữ Gà Gối Đầu",
        points: [
          "15 - 20 Chạp: Chọn gà trống đẹp mã làm gà cúng Tết / giỏ quà biếu giá cao (220k - 250k/con).",
          "21 - 28 Chạp: Xuất bán toàn bộ lợn bản đạt 30kg và vét sạch đàn gà 3T.",
          "Thu hồi toàn bộ tiền mặt vụ 1 (87M - 229M).",
          "GIỮ NGUYÊN 100% đàn gà 1T (lúc này đã thành gà giò 4.5 tháng) gối Rằm tháng Giêng, né bẫy sụt giá sau Tết."
        ],
        tip: "Chốt cọc trước với người quen và cơ quan đặt quà Tết từ đầu tháng Chạp để tối đa giá bán lẻ."
      }
    ];

    function formatVND(num, decimals = 1) {
      if (num === null || num === undefined) return "0 tr";
      return Number(num).toLocaleString('vi-VN', {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals
      }) + " tr";
    }

    function formatRawVND(num) {
      return Number(num).toLocaleString('vi-VN') + " đ";
    }

    // --- MAIN APP COMPONENT ---
    function App() {
      const [scenarioId, setScenarioId] = useState(130);
      const [chickenPrice, setChickenPrice] = useState(200000);
      const [pigPrice, setPigPrice] = useState(130000);
      const [feedSavingRate, setFeedSavingRate] = useState(0.40);
      const [chickenSurvRate, setChickenSurvRate] = useState(0.95);
      const [capexItems, setCapexItems] = useState(INITIAL_CAPEX);
      const [selectedRoadmapIdx, setSelectedRoadmapIdx] = useState(0);
      const [showGlossary, setShowGlossary] = useState(false);
      const [activeChartTab, setActiveChartTab] = useState('flow');

      const chartRef = useRef(null);
      const chartInstanceRef = useRef(null);

      const scenario = PRESETS[scenarioId];

      // Financial Calculation
      const chicken3mCount = scenario.chicken3mCount;
      const chickenSold = Math.floor(chicken3mCount * chickenSurvRate);
      const chickenRevenue = (chickenSold * chickenPrice) / 1000000;

      const pigsCount = scenario.pigsCount;
      const pigSold = pigsCount;
      const pigTotalWeight = pigSold * scenario.pigWeight;
      const pigRevenue = (pigTotalWeight * pigPrice) / 1000000;

      const totalRevenue = chickenRevenue + pigRevenue;

      const chicken3mCost = (chicken3mCount * scenario.chicken3mPrice) / 1000000;
      const chicken1mCount = scenario.chicken1mCount;
      const chicken1mCost = (chicken1mCount * scenario.chicken1mPrice) / 1000000;
      const pigCost = (pigsCount * scenario.pigPrice) / 1000000;
      const totalSeedCost = chicken3mCost + chicken1mCost + pigCost;

      const unreducedFeedCost = scenario.baseFeedCost / (1 - 0.40);
      const feedCost = unreducedFeedCost * (1 - feedSavingRate);
      const feedSavings = unreducedFeedCost - feedCost;

      const capex = scenario.capex;
      const totalCapital = capex + totalSeedCost + feedCost;

      const chicken1mRemaining = Math.floor(chicken1mCount * chickenSurvRate);
      const chicken1mValue = (chicken1mRemaining * scenario.chicken1mValuation) / 1000000;
      const equipmentResidual = scenario.equipmentResidual;
      const totalPostTetAssets = chicken1mValue + equipmentResidual;

      const cashProfit = totalRevenue - totalCapital;
      const totalNetProfit = cashProfit + totalPostTetAssets;
      const roi = (totalNetProfit / totalCapital) * 100;
      const netMargin = (totalNetProfit / totalRevenue) * 100;
      const cashRecoveryRate = (totalRevenue / totalCapital) * 100;

      const isCustomized =
        chickenPrice !== 200000 ||
        pigPrice !== 130000 ||
        feedSavingRate !== 0.40 ||
        chickenSurvRate !== 0.95;

      const resetDefaults = () => {
        setChickenPrice(200000);
        setPigPrice(130000);
        setFeedSavingRate(0.40);
        setChickenSurvRate(0.95);
      };

      const selectScenario = (id) => {
        setScenarioId(id);
        if (id === 170 && window.confetti) {
          window.confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
        }
      };

      const toggleCapex = (id) => {
        setCapexItems(prev => prev.map(item => item.id === id ? { ...item, completed: !item.completed } : item));
      };

      const completedCapexCount = capexItems.filter(i => i.completed).length;
      const completedCapexCost = capexItems.filter(i => i.completed).reduce((s, i) => s + i.cost, 0);

      // Re-render chart on data change
      useEffect(() => {
        if (!chartRef.current) return;
        if (chartInstanceRef.current) {
          chartInstanceRef.current.destroy();
        }

        const ctx = chartRef.current.getContext('2d');

        if (activeChartTab === 'flow') {
          chartInstanceRef.current = new Chart(ctx, {
            type: 'bar',
            data: {
              labels: ['Vốn ban đầu', 'Doanh thu Tết', 'Lãi tiền mặt', 'Tài sản sau Tết', 'LỢI NHUẬN RÒNG'],
              datasets: [{
                data: [
                  totalCapital.toFixed(1),
                  totalRevenue.toFixed(1),
                  cashProfit.toFixed(1),
                  totalPostTetAssets.toFixed(1),
                  totalNetProfit.toFixed(1)
                ],
                backgroundColor: [
                  '#475569',
                  '#10b981',
                  cashProfit >= 0 ? '#2563eb' : '#d97706',
                  '#8b5cf6',
                  '#047857'
                ],
                borderRadius: 6
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { display: false },
                tooltip: {
                  callbacks: {
                    label: (ctx) => `${ctx.raw} Triệu VNĐ`
                  }
                }
              },
              scales: {
                y: {
                  ticks: { callback: (val) => `${val} tr` }
                }
              }
            }
          });
        } else if (activeChartTab === 'costs') {
          chartInstanceRef.current = new Chart(ctx, {
            type: 'doughnut',
            data: {
              labels: ['CAPEX Hạ tầng', 'Giống gà 3T', 'Giống gà 1T', 'Giống lợn nhỡ', 'Thức ăn & Thú y'],
              datasets: [{
                data: [
                  capex.toFixed(1),
                  chicken3mCost.toFixed(1),
                  chicken1mCost.toFixed(1),
                  pigCost.toFixed(1),
                  feedCost.toFixed(1)
                ],
                backgroundColor: ['#047857', '#10b981', '#38bdf8', '#f59e0b', '#64748b']
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } },
                tooltip: {
                  callbacks: {
                    label: (ctx) => `${ctx.label}: ${ctx.raw} tr (${((ctx.raw / totalCapital) * 100).toFixed(1)}%)`
                  }
                }
              }
            }
          });
        } else if (activeChartTab === 'comparison') {
          const labels = ['Gói 100 Triệu', 'Gói 130 Triệu', 'Gói 170 Triệu'];
          const capitals = [100, 130, 170];
          const revs = [
            ((400 * 0.95 * chickenPrice) + (3 * 30 * pigPrice)) / 1000000,
            ((650 * 0.95 * chickenPrice) + (6 * 30 * pigPrice)) / 1000000,
            ((1000 * 0.95 * chickenPrice) + (10 * 30 * pigPrice)) / 1000000
          ];
          const profits = [
            revs[0] + (200 * 0.95 * 130000) / 1000000 + 32.0 - capitals[0],
            revs[1] + (300 * 0.95 * 130000) / 1000000 + 32.0 - capitals[1],
            revs[2] + (400 * 0.95 * 130000) / 1000000 + 32.0 - capitals[2]
          ];

          chartInstanceRef.current = new Chart(ctx, {
            type: 'bar',
            data: {
              labels,
              datasets: [
                { label: 'Vốn đầu tư', data: capitals, backgroundColor: '#64748b', borderRadius: 4 },
                { label: 'Doanh thu Tết', data: revs.map(r => r.toFixed(1)), backgroundColor: '#10b981', borderRadius: 4 },
                { label: 'Lợi nhuận ròng', data: profits.map(p => p.toFixed(1)), backgroundColor: '#047857', borderRadius: 4 }
              ]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { position: 'top', labels: { boxWidth: 12, font: { size: 11 } } },
                tooltip: {
                  callbacks: { label: (ctx) => `${ctx.dataset.label}: ${ctx.raw} tr` }
                }
              },
              scales: {
                y: { ticks: { callback: (val) => `${val} tr` } }
              }
            }
          });
        }

        return () => {
          if (chartInstanceRef.current) chartInstanceRef.current.destroy();
        };
      }, [activeChartTab, scenarioId, chickenPrice, pigPrice, feedSavingRate, chickenSurvRate]);

      // Re-trigger Lucide icon replacement
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      return (
        <div className="min-h-screen flex flex-col font-sans">
          {/* Header */}
          <header className="bg-gradient-to-r from-emerald-950 via-emerald-900 to-teal-950 text-white shadow-xl sticky top-0 z-40 border-b border-emerald-800/60 no-print">
            <div className="max-w-7xl mx-auto px-4 py-3.5 flex flex-col md:flex-row justify-between items-center gap-3">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center shadow-lg ring-2 ring-emerald-400/30">
                  <i data-lucide="mountain" className="w-5 h-5 text-white"></i>
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="text-base sm:text-lg font-bold tracking-tight text-white">
                      Kế Hoạch Khởi Động & Phân Tích Lợi Nhuận Trang Trại
                    </h1>
                    <span className="bg-amber-500/20 text-amber-300 text-[11px] px-2 py-0.5 rounded-full font-bold border border-amber-500/40">
                      Vụ Tết
                    </span>
                  </div>
                  <p className="text-xs text-emerald-200/90 mt-0.5">
                    Mô hình tuần hoàn: Gà Lạc Sơn (1T & 3T) • Lợn bản F1 • Thân chuối men vi sinh • Thu hồi vốn 100-120 ngày
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-2 flex-wrap justify-center">
                <div className="flex items-center gap-1.5 bg-emerald-900/80 px-3 py-1.5 rounded-lg border border-emerald-700/50 text-xs">
                  <i data-lucide="clock" className="w-4 h-4 text-amber-400"></i>
                  <span>Đếm ngược xuất bán: <strong className="text-amber-300">100 - 120 Ngày</strong> (Trước 28 Chạp)</span>
                </div>

                <button
                  onClick={() => setShowGlossary(true)}
                  className="text-xs bg-emerald-800/80 hover:bg-emerald-700 text-emerald-100 px-2.5 py-1.5 rounded-lg border border-emerald-600/50 flex items-center gap-1"
                >
                  <i data-lucide="help-circle" className="w-3.5 h-3.5"></i>
                  <span>Thuật ngữ</span>
                </button>

                <button
                  onClick={resetDefaults}
                  className="text-xs bg-emerald-800/80 hover:bg-emerald-700 text-emerald-100 px-2.5 py-1.5 rounded-lg border border-emerald-600/50 flex items-center gap-1"
                >
                  <i data-lucide="rotate-ccw" className="w-3.5 h-3.5"></i>
                  <span>Đặt lại</span>
                </button>

                <button
                  onClick={() => window.print()}
                  className="text-xs bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg font-semibold shadow flex items-center gap-1.5"
                >
                  <i data-lucide="printer" className="w-3.5 h-3.5"></i>
                  <span>In Báo Cáo</span>
                </button>
              </div>
            </div>
          </header>

          {/* Main Dashboard */}
          <main className="max-w-7xl mx-auto px-4 py-6 space-y-6 flex-1 w-full">
            {/* 1. SCENARIO SELECTOR */}
            <section className="bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
              <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4">
                <div>
                  <h2 className="text-base sm:text-lg font-bold text-slate-900 flex items-center gap-2">
                    <i data-lucide="wallet" className="w-5 h-5 text-emerald-600"></i>
                    Chọn Kịch Bản Vốn Ban Đầu
                    {isCustomized && (
                      <span className="text-xs bg-amber-100 text-amber-800 border border-amber-300 font-semibold px-2 py-0.5 rounded-full">
                        Đang giả lập tùy chỉnh
                      </span>
                    )}
                  </h2>
                  <p className="text-xs sm:text-sm text-slate-500">
                    Xem ngay quy mô đàn nuôi, dòng tiền thu hồi và tổng lợi nhuận kinh tế vụ Tết
                  </p>
                </div>

                {isCustomized && (
                  <button
                    onClick={resetDefaults}
                    className="text-xs text-emerald-700 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 px-3 py-1.5 rounded-lg font-medium"
                  >
                    Về thông số gốc của gói
                  </button>
                )}
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                {Object.values(PRESETS).map((p) => {
                  const isSelected = scenarioId === p.id;
                  return (
                    <div
                      key={p.id}
                      onClick={() => selectScenario(p.id)}

                    </tr>
                    <tr>
                      <td className="py-2 px-3 pl-6 font-medium">2. Giá trị thiết bị hạ tầng còn lại (khấu hao 20% vụ đầu)</td>
                      <td className="py-2 px-2 text-center">80% giá trị</td>
                      <td className="py-2 px-3 text-right">-</td>
                      <td className="py-2 px-3 text-right font-medium">{(equipmentResidual * 1000000).toLocaleString('vi-VN')} đ</td>
                      <td className="py-2 px-3 text-right font-bold text-amber-800">{formatVND(equipmentResidual, 2)}</td>
                    </tr>
                    <tr className="bg-amber-100 font-bold border-t border-amber-200">
                      <td colSpan={4} className="py-2.5 px-3 text-amber-950">TỔNG TÀI SẢN TÍCH LŨY CÒN LẠI SAU TẾT (D)</td>
                      <td className="py-2.5 px-3 text-right text-amber-900 font-black text-base">+{formatVND(totalPostTetAssets, 2)}</td>
                    </tr>

                    {/* E. LỢI NHUẬN RÒNG KINH TẾ */}
                    <tr className="bg-gradient-to-r from-emerald-800 to-teal-900 text-white font-bold border-t-2 border-emerald-500">
                      <td colSpan={4} className="py-3 px-3 pl-4">
                        <span className="text-sm sm:text-base font-black tracking-tight text-white block">
                          E. TỔNG LỢI NHUẬN RÒNG KINH TẾ (E = C + D)
                        </span>
                        <span className="text-[11px] text-emerald-200 font-normal">
                          Tổng lãi thực tế: Dòng tiền mặt dôi dư + Đàn gà giò gối đầu + Hạ tầng thiết bị
                        </span>
                      </td>
                      <td className="py-3 px-3 text-right font-black text-lg sm:text-xl text-amber-300">
                        +{formatVND(totalNetProfit, 2)}
                      </td>
                    </tr>

                    {/* F. CHỈ SỐ */}
                    <tr className="bg-slate-50 font-semibold text-slate-700 text-xs">
                      <td colSpan={2} className="py-2.5 px-3">
                        Tỷ suất hoàn vốn ROI (E / B): <strong className="text-emerald-700 ml-1">{roi.toFixed(1)}%</strong>
                      </td>
                      <td colSpan={2} className="py-2.5 px-3 text-center">
                        Biên lợi nhuận ròng: <strong className="text-emerald-700 ml-1">{netMargin.toFixed(1)}%</strong>
                      </td>
                      <td className="py-2.5 px-3 text-right">
                        Tỷ lệ thu hồi tiền mặt: <strong className="text-blue-700 ml-1">{cashRecoveryRate.toFixed(1)}%</strong>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </section>

            {/* 5. ROADMAP & CAPEX CHECKLIST */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start">
              {/* Roadmap */}
              <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 space-y-4">
                <div className="border-b border-slate-100 pb-3 flex justify-between items-center">
                  <div>
                    <h3 className="text-base font-bold text-slate-900 flex items-center gap-2">
                      <i data-lucide="route" className="w-5 h-5 text-emerald-600"></i>
                      Lộ Trình Triển Khai Thần Tốc (3 Tháng)
                    </h3>
                    <p className="text-xs text-slate-500">Các mốc hành động tuần tự để kịp xuất bán trước Tết</p>
                  </div>
                </div>

                <div className="grid grid-cols-5 gap-1.5">
                  {ROADMAP.map((step, idx) => (
                    <button
                      key={idx}
                      onClick={() => setSelectedRoadmapIdx(idx)}
                      className={`p-2 rounded-lg border text-left text-xs transition ${
                        selectedRoadmapIdx === idx
                          ? "bg-emerald-800 text-white border-emerald-900"
                          : "bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100"
                      }`}
                    >
                      <div className="font-bold text-[10px] opacity-80">{step.week}</div>
                      <div className="font-bold truncate text-[11px]">{step.phase}</div>
                    </button>
                  ))}
                </div>

                {ROADMAP[selectedRoadmapIdx] && (
                  <div className="bg-slate-50 rounded-xl p-4 border border-slate-200 space-y-3">
                    <div className="flex justify-between items-start">
                      <div>
                        <span className="text-xs font-bold text-emerald-800 uppercase">{ROADMAP[selectedRoadmapIdx].week}</span>
                        <h4 className="text-sm font-bold text-slate-900">{ROADMAP[selectedRoadmapIdx].title}</h4>
                      </div>
                      <span className="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded font-bold">
                        {ROADMAP[selectedRoadmapIdx].tag}
                      </span>
                    </div>

                    <ul className="space-y-1.5 text-xs text-slate-700">
                      {ROADMAP[selectedRoadmapIdx].points.map((pt, i) => (
                        <li key={i} className="flex items-start gap-2">
                          <i data-lucide="check-circle" className="w-3.5 h-3.5 text-emerald-600 flex-shrink-0 mt-0.5"></i>
                          <span>{pt}</span>
                        </li>
                      ))}
                    </ul>

                    <div className="p-2.5 bg-amber-50 rounded border border-amber-200 text-[11px] text-amber-900 flex items-start gap-2">
                      <i data-lucide="alert-triangle" className="w-3.5 h-3.5 text-amber-600 flex-shrink-0 mt-0.5"></i>
                      <span><strong>Lưu ý kỹ thuật:</strong> {ROADMAP[selectedRoadmapIdx].tip}</span>
                    </div>
                  </div>
                )}
              </div>

              {/* Capex Checklist */}
              <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 space-y-4">
                <div className="border-b border-slate-100 pb-3 flex justify-between items-center">
                  <div>
                    <h3 className="text-base font-bold text-slate-900 flex items-center gap-2">
                      <i data-lucide="wrench" className="w-5 h-5 text-emerald-600"></i>
                      Checklist Hạ Tầng & Thiết Bị (~40 Triệu)
                    </h3>
                    <p className="text-xs text-slate-500">Nghiệm thu hoàn tất trong tuần đầu khởi động</p>
                  </div>
                  <div className="text-right text-xs">
                    <span className="font-bold text-emerald-700">{completedCapexCount}/{capexItems.length} xong</span>
                  </div>
                </div>

                <div className="space-y-2 max-h-80 overflow-y-auto pr-1">
                  {capexItems.map((item) => (
                    <div
                      key={item.id}
                      onClick={() => toggleCapex(item.id)}
                      className={`p-2.5 rounded-xl border flex items-start gap-2.5 cursor-pointer transition ${
                        item.completed ? "bg-slate-50 border-slate-200" : "bg-white border-amber-200"
                      }`}
                    >
                      <input
                        type="checkbox"
                        checked={item.completed}
                        onChange={() => {}}
                        className="mt-0.5 accent-emerald-600 w-4 h-4 cursor-pointer"
                      />
                      <div className="flex-1 min-w-0">
                        <div className="flex justify-between">
                          <span className="text-xs font-bold text-slate-800">{item.name}</span>
                          <span className="text-xs font-black text-emerald-700">{formatVND(item.cost, 1)}</span>
                        </div>
                        <p className="text-[11px] text-slate-500 line-clamp-1">{item.note}</p>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="p-2.5 bg-amber-50 rounded border border-amber-200 text-xs text-amber-900 flex items-center gap-2">
                  <i data-lucide="info" className="w-4 h-4 text-amber-600 flex-shrink-0"></i>
                  <span><strong>Tre nứa tự nhiên:</strong> Làm chuồng ngủ 100% bằng tre tại đồi, tiết kiệm hàng chục triệu tiền sắt thép.</span>
                </div>
              </div>
            </div>

            {/* 6. STRATEGIC EXECUTIVE INSIGHTS */}
            <section className="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 space-y-4">
              <div className="border-b border-slate-100 pb-3">
                <h3 className="text-base font-bold text-slate-900 flex items-center gap-2">
                  <i data-lucide="lightbulb" className="w-5 h-5 text-amber-600"></i>
                  Phân Tích Chiến Lược & Luận Điểm Đầu Tư
                </h3>
                <p className="text-xs text-slate-500">Giải trình chuyên sâu dành cho nhà đầu tư</p>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
                <div className="p-4 rounded-xl bg-emerald-50/60 border border-emerald-200 space-y-2">
                  <h4 className="font-bold text-emerald-900 text-sm flex items-center gap-1.5">
                    <i data-lucide="star" className="w-4 h-4 text-emerald-600"></i>
                    Tại sao Gói 130M là 'Điểm Cân Bằng Vàng'?
                  </h4>
                  <p className="text-slate-700 leading-relaxed">
                    Khai thác tối đa 100% công suất của nhóm 4 người trong 100 ngày. Thu về ngay 147 triệu tiền mặt trước 28 Tết (dôi dư 17 triệu tiền mặt sau khi hoàn 100% vốn gốc), đồng thời giữ nguyên vẹn 285 gà giò và 32 triệu tài sản máy móc.
                  </p>
                </div>

                <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
                  <h4 className="font-bold text-slate-900 text-sm flex items-center gap-1.5">
                    <i data-lucide="check-circle-2" className="w-4 h-4 text-slate-600"></i>
                    Dòng Tiền Mặt vs Lợi Nhuận Kinh Tế
                  </h4>
                  <p className="text-slate-700 leading-relaxed">
                    Dòng tiền mặt chỉ tính số tiền mặt rút về tay tại ngày 28 Tết. Lợi nhuận kinh tế tính đầy đủ cả đàn gà giò gối đầu và giá trị khấu hao tài sản hạ tầng dùng nhiều năm.
                  </p>
                </div>

                <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
                  <h4 className="font-bold text-slate-900 text-sm flex items-center gap-1.5">
                    <i data-lucide="check-circle-2" className="w-4 h-4 text-slate-600"></i>
                    Chiến Thuật Né 'Bẫy Sụt Giá Ra Giêng'
                  </h4>
                  <p className="text-slate-700 leading-relaxed">
                    Không bán tháo gà giò sau Tết khi nhu cầu sụt giảm. Đàn 1T được giữ nuôi tới Rằm tháng Giêng - lúc nhu cầu lễ thượng nguyên tăng vọt trở lại để bán với giá cao nhất.
                  </p>
                </div>
              </div>
            </section>
          </main>

          {/* Footer */}
          <footer className="mt-8 border-t border-slate-200 bg-white py-6 text-slate-500 text-xs text-center">
            <div className="max-w-7xl mx-auto px-4 space-y-2">
              <div className="font-bold text-slate-800">
                Trang Trại Hữu Cơ Bán Tự Nhiên • Kế Hoạch Tài Chính & Vận Hành Vụ Tết
              </div>
              <p className="text-slate-400">
                Thiết kế chuẩn Executive Financial Dashboard cho Startup Nông Nghiệp • Dòng tiền & Lợi nhuận minh bạch
              </p>
            </div>
          </footer>

          {/* GLOSSARY MODAL */}
          {showGlossary && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl shadow-2xl max-w-xl w-full p-5 space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-bold text-base text-slate-900 flex items-center gap-2">
                    <i data-lucide="book-open" className="w-5 h-5 text-emerald-600"></i>
                    Giải Thích Thuật Ngữ & Công Thức
                  </h3>
                  <button onClick={() => setShowGlossary(false)} className="text-slate-400 hover:text-slate-700">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                <div className="space-y-3 text-xs">
                  <div className="bg-slate-50 p-3 rounded-lg border border-slate-200">
                    <strong className="text-emerald-800 block mb-1">1. Dòng Tiền Mặt Cầm Về (Cash Profit):</strong>
                    Doanh thu bán Tết - Tổng vốn đầu tư. Thể hiện lượng tiền mặt rút về sau khi hoàn 100% vốn gốc.
                  </div>
                  <div className="bg-slate-50 p-3 rounded-lg border border-slate-200">
                    <strong className="text-emerald-800 block mb-1">2. Tài Sản Tích Lũy Sau Tết:</strong>
                    (Đàn gà 1T × 95% sống × 130.000đ khi lên giò 4.5 tháng) + 32 triệu thiết bị sau khấu hao 20%.
                  </div>
                  <div className="bg-slate-50 p-3 rounded-lg border border-slate-200">
                    <strong className="text-emerald-800 block mb-1">3. Lợi Nhuận Ròng Kinh Tế (Net Profit):</strong>
                    Dòng tiền mặt thuần + Giá trị tài sản sau Tết.
                  </div>
                  <div className="bg-slate-50 p-3 rounded-lg border border-slate-200">
                    <strong className="text-emerald-800 block mb-1">4. Tỷ Suất Hoàn Vốn ROI (%):</strong>
                    (Lợi nhuận ròng kinh tế / Tổng vốn ban đầu) × 100%.
                  </div>
                </div>

                <div className="text-right pt-2 border-t">
                  <button
                    onClick={() => setShowGlossary(false)}
                    className="px-4 py-2 bg-emerald-700 hover:bg-emerald-800 text-white rounded-lg text-xs font-semibold"
                  >
                    Đã Hiểu & Đóng
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
