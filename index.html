    const ROADMAP = [
      {

          "Chặt tre nứa tại chỗ dựng chuồng ngủ, căng bạt dứa chắn gió bấc, chia 2 ô rào cước (ô gà 3T và ô gà 1T)."
        ],
        tip: "Chuồng tre nứa tiết kiệm 100% tiền mua sắt thép, mái bạt dứa cần căng dốc thoát nước mưa tốt."
      },
      {
        week: "Tuần 2",

      {

        phase: "Chăm Sóc & Vỗ Béo",

        ],
        tip: "Kiểm tra gà hàng tuần, phân loại trống mái để chuẩn bị kênh xuất bán Tết."
      },
      {
        week: "Tháng 3 (Cận Tết)",
        phase: "Xuất Bán & Thu Tiền",
        tag: "Thu tiền mặt",
        title: "15 - 28 Chạp: Xuất Bán Thần Tốc, Vét Đàn 3T & Giữ Gà Gối Đầu",
        points: [
          "15 - 20 Chạp: Chọn gà trống đẹp mã làm gà cúng Tết / giỏ quà biếu giá cao (220k - 250k/con).",
          "21 - 28 Chạp: Xuất bán toàn bộ lợn bản đạt 30kg và vét sạch đàn gà 3T.",
          "Thu hồi toàn bộ tiền mặt vụ 1 (87M - 229M).",
          "GIỮ NGUYÊN 100% đàn gà 1T (lúc này đã thành gà giò 4.5 tháng) gối Rằm tháng Giêng, né bẫy sụt giá sau Tết."
        ],
        tip: "Chốt cọc trước với người quen và cơ quan đặt quà Tết từ đầu tháng Chạp để tối đa giá bán lẻ."
      }
    ];

    function formatVND(num, decimals = 1) {
      if (num === null || num === undefined) return "0 tr";
      return Number(num).toLocaleString('vi-VN', {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals
      }) + " tr";
    }

    function formatRawVND(num) {
      return Number(num).toLocaleString('vi-VN') + " đ";
    }

    // --- MAIN APP COMPONENT ---
    function App() {
      const [scenarioId, setScenarioId] = useState(130);
      const [chickenPrice, setChickenPrice] = useState(200000);
      const [pigPrice, setPigPrice] = useState(130000);
      const [feedSavingRate, setFeedSavingRate] = useState(0.40);
      const [chickenSurvRate, setChickenSurvRate] = useState(0.95);
      const [capexItems, setCapexItems] = useState(INITIAL_CAPEX);
      const [selectedRoadmapIdx, setSelectedRoadmapIdx] = useState(0);
      const [showGlossary, setShowGlossary] = useState(false);
      const [showFullPL, setShowFullPL] = useState(false);
      const [activeChartTab, setActiveChartTab] = useState('flow');

      const chartRef = useRef(null);
      const chartInstanceRef = useRef(null);

      const scenario = PRESETS[scenarioId];

      // Financial Calculation
      const chicken3mCount = scenario.chicken3mCount;
      const chickenSold = Math.floor(chicken3mCount * chickenSurvRate);
      const chickenRevenue = (chickenSold * chickenPrice) / 1000000;

      const pigsCount = scenario.pigsCount;
      const pigSold = pigsCount;
      const pigTotalWeight = pigSold * scenario.pigWeight;
      const pigRevenue = (pigTotalWeight * pigPrice) / 1000000;

      const totalRevenue = chickenRevenue + pigRevenue;

      const chicken3mCost = (chicken3mCount * scenario.chicken3mPrice) / 1000000;
      const chicken1mCount = scenario.chicken1mCount;
      const chicken1mCost = (chicken1mCount * scenario.chicken1mPrice) / 1000000;
      const pigCost = (pigsCount * scenario.pigPrice) / 1000000;
      const totalSeedCost = chicken3mCost + chicken1mCost + pigCost;

      const unreducedFeedCost = scenario.baseFeedCost / (1 - 0.40);
      const feedCost = unreducedFeedCost * (1 - feedSavingRate);
      const feedSavings = unreducedFeedCost - feedCost;

      const capex = scenario.capex;
      const totalCapital = capex + totalSeedCost + feedCost;

      const chicken1mRemaining = Math.floor(chicken1mCount * chickenSurvRate);
      const chicken1mValue = (chicken1mRemaining * scenario.chicken1mValuation) / 1000000;
      const equipmentResidual = scenario.equipmentResidual;
      const totalPostTetAssets = chicken1mValue + equipmentResidual;

      const cashProfit = totalRevenue - totalCapital;
      const totalNetProfit = cashProfit + totalPostTetAssets;
      const roi = (totalNetProfit / totalCapital) * 100;
      const netMargin = (totalNetProfit / totalRevenue) * 100;
      const cashRecoveryRate = (totalRevenue / totalCapital) * 100;

      const isCustomized =
        chickenPrice !== 200000 ||
        pigPrice !== 130000 ||
        feedSavingRate !== 0.40 ||
        chickenSurvRate !== 0.95;

      const resetDefaults = () => {
        setChickenPrice(200000);
        setPigPrice(130000);
        setFeedSavingRate(0.40);
        setChickenSurvRate(0.95);
      };

      const selectScenario = (id) => {
        setScenarioId(id);
        if (id === 170 && window.confetti) {
          window.confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
        }
      };

      const toggleCapex = (id) => {
        setCapexItems(prev => prev.map(item => item.id === id ? { ...item, completed: !item.completed } : item));
      };

      const completedCapexCount = capexItems.filter(i => i.completed).length;

      // Cost Breakdown Items
      const costItems = [
        {
          index: 1,
          name: "Hạ tầng, 2km ống nước, 2 điều hòa, bơm, máy cắt cỏ",
          qty: "Gói chuẩn",
          amount: capex,
          note: "Tài sản máy móc dùng lâu dài nhiều vụ",
          badge: "Cố định",
          badgeColor: "bg-slate-100 text-slate-700"
        },
        {
          index: 2,
          name: "Giống gà Lạc Sơn 3 tháng tuổi (vỗ béo bán Tết)",
          qty: `${chicken3mCount} con`,
          amount: chicken3mCost,
          note: "Vào chuồng thả đồi 100 ngày đạt xuất chuồng",
          badge: "Xuất Tết",
          badgeColor: "bg-emerald-100 text-emerald-800"
        },
        {
          index: 3,
          name: "Giống gà Lạc Sơn 1 tháng tuổi (gối đầu sau Tết)",
          qty: `${chicken1mCount} con`,
          amount: chicken1mCost,
          note: "Giá giống tối ưu 12k/con, gối sóng Rằm tháng Giêng",
          badge: "12.000đ/con",
          badgeColor: "bg-blue-100 text-blue-800 font-bold"
        },
        {
          index: 4,
          name: "Giống lợn bản nhỡ F1 (12 - 15kg/con)",
          qty: `${pigsCount} con`,
          amount: pigCost,
          note: "Thả thung lũng, đạt 30kg thịt thơm",
          badge: "Xuất Tết",
          badgeColor: "bg-emerald-100 text-emerald-800"
        },
        {
          index: 5,
          name: "Thức ăn 100 ngày + Vắc xin thú y",
          qty: "100 ngày",
          amount: feedCost,
          note: `Đã giảm ${Math.round(feedSavingRate * 100)}% nhờ băm thân chuối đồi ủ men (tiết kiệm ${formatVND(feedSavings, 1)})`,
          badge: "Ủ chuối men",
          badgeColor: "bg-amber-100 text-amber-800"
        }
      ];

      // Re-render Chart
      useEffect(() => {
        if (!chartRef.current) return;
        if (chartInstanceRef.current) {
          chartInstanceRef.current.destroy();
        }

        const ctx = chartRef.current.getContext('2d');

        if (activeChartTab === 'flow') {
          chartInstanceRef.current = new Chart(ctx, {
            type: 'bar',
            data: {
              labels: ['Vốn ban đầu', 'Doanh thu Tết', 'Lãi tiền mặt', 'Tài sản sau Tết', 'LỢI NHUẬN RÒNG'],
              datasets: [{
                data: [
                  totalCapital.toFixed(1),
                  totalRevenue.toFixed(1),
                  cashProfit.toFixed(1),
                  totalPostTetAssets.toFixed(1),
                  totalNetProfit.toFixed(1)
                ],
                backgroundColor: [
                  '#475569',
                  '#10b981',
                  cashProfit >= 0 ? '#2563eb' : '#d97706',
                  '#8b5cf6',
                  '#047857'
                ],
                borderRadius: 6
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: { y: { ticks: { callback: (val) => `${val} tr` } } }
            }
          });
        } else if (activeChartTab === 'costs') {
          chartInstanceRef.current = new Chart(ctx, {
            type: 'doughnut',
            data: {
              labels: ['Hạ tầng', 'Gà 3T', 'Gà 1T (12k)', 'Lợn giống', 'Thức ăn & Thú y'],
              datasets: [{
                data: [
                  capex.toFixed(1),
                  chicken3mCost.toFixed(1),
                  chicken1mCost.toFixed(1),
                  pigCost.toFixed(1),
                  feedCost.toFixed(1)
                ],
                backgroundColor: ['#047857', '#10b981', '#38bdf8', '#f59e0b', '#64748b']
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } } }
            }
          });
        } else if (activeChartTab === 'comparison') {
          const labels = ['Gói 100 Triệu', 'Gói 130 Triệu', 'Gói 170 Triệu'];
          const capitals = [100, 130, 170];
          const revs = [
            ((400 * 0.95 * chickenPrice) + (3 * 30 * pigPrice)) / 1000000,
            ((650 * 0.95 * chickenPrice) + (6 * 30 * pigPrice)) / 1000000,
            ((1000 * 0.95 * chickenPrice) + (10 * 30 * pigPrice)) / 1000000
          ];
          const profits = [
            revs[0] + (200 * 0.95 * 130000) / 1000000 + 32.0 - capitals[0],
            revs[1] + (300 * 0.95 * 130000) / 1000000 + 32.0 - capitals[1],
            revs[2] + (400 * 0.95 * 130000) / 1000000 + 32.0 - capitals[2]
          ];

          chartInstanceRef.current = new Chart(ctx, {
            type: 'bar',
            data: {
              labels,
              datasets: [
                { label: 'Vốn đầu tư', data: capitals, backgroundColor: '#64748b', borderRadius: 4 },
                { label: 'Doanh thu Tết', data: revs.map(r => r.toFixed(1)), backgroundColor: '#10b981', borderRadius: 4 },
                { label: 'Lợi nhuận ròng', data: profits.map(p => p.toFixed(1)), backgroundColor: '#047857', borderRadius: 4 }
              ]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { position: 'top', labels: { boxWidth: 10, font: { size: 10 } } } },
              scales: { y: { ticks: { callback: (val) => `${val} tr` } } }
            }
          });
        }

        return () => {
          if (chartInstanceRef.current) chartInstanceRef.current.destroy();
        };
      }, [activeChartTab, scenarioId, chickenPrice, pigPrice, feedSavingRate, chickenSurvRate]);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      return (
        <div className="min-h-screen flex flex-col font-sans">
          {/* Header */}
          <header className="bg-gradient-to-r from-emerald-950 via-emerald-900 to-teal-950 text-white shadow-md sticky top-0 z-40 border-b border-emerald-800/60 no-print">
            <div className="max-w-7xl mx-auto px-3 sm:px-6 py-2.5 flex flex-col sm:flex-row justify-between items-center gap-2">
              <div className="flex items-center gap-2.5 w-full sm:w-auto">
                <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center shadow ring-2 ring-emerald-400/30 flex-shrink-0">
                  <i data-lucide="mountain" className="w-4 h-4 text-white"></i>
                </div>
                <div className="min-w-0">
                  <div className="flex items-center gap-1.5 flex-wrap">
                    <h1 className="text-sm sm:text-base font-black tracking-tight text-white truncate">
                      Kế Hoạch Trang Trại Vụ Tết
                    </h1>
                    <span className="bg-amber-500/25 text-amber-300 text-[10px] px-1.5 py-0.2 rounded-full font-bold border border-amber-500/40">
                      100-120 Ngày
                    </span>
                  </div>
                  <p className="text-[11px] text-emerald-200/90 truncate">
                    Gà Lạc Sơn (1T @ 12k & 3T) • Lợn bản F1 • Chuối men vi sinh
                  </p>
                </div>
              </div>

              <div className="flex items-center justify-between sm:justify-end gap-1.5 w-full sm:w-auto text-xs">
                <div className="flex items-center gap-1 bg-emerald-900/80 px-2 py-1 rounded border border-emerald-700/50 text-[11px]">
                  <i data-lucide="clock" className="w-3.5 h-3.5 text-amber-400"></i>
                  <span>Xuất bán: <strong className="text-amber-300">Trước 28 Chạp</strong></span>
                </div>

                <div className="flex items-center gap-1">
                  <button
                    onClick={() => setShowGlossary(true)}
                    className="text-[11px] bg-emerald-800/80 hover:bg-emerald-700 text-emerald-100 px-2 py-1 rounded border border-emerald-600/50"
                  >
                    Thuật ngữ
                  </button>
                  <button
                    onClick={resetDefaults}
                    className="text-[11px] bg-emerald-800/80 hover:bg-emerald-700 text-emerald-100 px-2 py-1 rounded border border-emerald-600/50"
                  >
                    Đặt lại
                  </button>
                  <button
                    onClick={() => window.print()}
                    className="text-[11px] bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1 rounded font-bold shadow"
                  >
                    In
                  </button>
                </div>
              </div>
            </div>
          </header>

          {/* MAIN DASHBOARD: THEO ĐÚNG THỨ TỰ ƯU TIÊN YÊU CẦU */}
          <main className="max-w-7xl mx-auto px-3 sm:px-6 py-3.5 sm:py-6 space-y-4 sm:space-y-6 flex-1 w-full">

                    onClick={() => setSelectedRoadmapIdx(idx)}
                    className={`p-2 rounded-xl border text-left text-xs transition touch-manipulation ${
                      selectedRoadmapIdx === idx
                        ? "bg-emerald-800 text-white border-emerald-900 shadow"
                        : "bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100"
                    }`}
                  >
                    <div className="font-bold text-[10px] opacity-80">{step.week}</div>
                    <div className="font-bold truncate text-[11px]">{step.phase}</div>
                  </button>
                ))}
              </div>

              {ROADMAP[selectedRoadmapIdx] && (
                <div className="bg-slate-50 rounded-xl p-3 sm:p-4 border border-slate-200 space-y-2.5">
                  <div className="flex justify-between items-start gap-2">
                    <div>
                      <span className="text-[10px] font-black bg-emerald-700 text-white px-2 py-0.5 rounded-full">
                        {ROADMAP[selectedRoadmapIdx].week}
                      </span>
                      <h4 className="text-xs sm:text-sm font-bold text-slate-900 mt-1">
                        {ROADMAP[selectedRoadmapIdx].title}
                      </h4>
                    </div>
                    <span className="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded font-bold whitespace-nowrap">
                      {ROADMAP[selectedRoadmapIdx].tag}
                    </span>
                  </div>

                  <ul className="space-y-1.5 text-xs text-slate-700">
                    {ROADMAP[selectedRoadmapIdx].points.map((pt, i) => (
                      <li key={i} className="flex items-start gap-2">
                        <i data-lucide="check-circle" className="w-3.5 h-3.5 text-emerald-600 flex-shrink-0 mt-0.5"></i>
                        <span className="leading-relaxed">{pt}</span>
                      </li>
                    ))}
                  </ul>

                  <div className="p-2.5 bg-amber-50 rounded border border-amber-200 text-[11px] text-amber-900 flex items-start gap-2">
                    <i data-lucide="alert-triangle" className="w-3.5 h-3.5 text-amber-600 flex-shrink-0 mt-0.5"></i>
                    <span><strong>Lưu ý kỹ thuật:</strong> {ROADMAP[selectedRoadmapIdx].tip}</span>
                  </div>
                </div>
              )}
            </section>

            {/* 5. MÔ PHỎNG VÀ PHÂN TÍCH BIỂU ĐỒ (ĐỂ PHÍA DƯỚI) */}
            <section className="space-y-3 pt-1">
              <div className="border-t border-slate-200 pt-3 px-1">
                <h2 className="text-sm sm:text-base font-extrabold text-slate-900 flex items-center gap-2">
                  <span className="w-2 h-2 rounded-full bg-slate-400"></span>
                  5. Công Cụ Mô Phỏng Nâng Cao & Phân Tích Biểu Đồ
                </h2>
                <p className="text-[11px] sm:text-xs text-slate-500">
                  Kéo trượt để thử nghiệm độ nhạy giá bán và xem đồ thị cơ cấu tài chính
                </p>
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-2 gap-3 sm:gap-4 items-start">
                {/* Simulator */}
                <div className="bg-white rounded-2xl shadow-sm border border-slate-200/90 p-3.5 sm:p-5 space-y-3">
                  <div className="flex justify-between items-center border-b border-slate-100 pb-2.5">
                    <div>
                      <h3 className="text-xs sm:text-sm font-bold text-slate-900 flex items-center gap-1.5">
                        <i data-lucide="sliders" className="w-4 h-4 text-emerald-600"></i>
                        Mô Phỏng Độ Nhạy Thị Trường
                      </h3>
                      <p className="text-[10px] text-slate-500">Thử nghiệm các mức giá bán biến động</p>
                    </div>
                    <button
                      onClick={resetDefaults}
                      className="text-[11px] text-slate-600 bg-slate-100 hover:bg-slate-200 px-2 py-0.5 rounded"
                    >
                      Về gốc
                    </button>
                  </div>

                  <div className="space-y-2.5">
                    {/* Slider Gà */}
                    <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-200 space-y-1">
                      <div className="flex justify-between text-xs font-semibold text-slate-700">
                        <span>🐔 Giá gà Lạc Sơn / con:</span>
                        <span className="text-emerald-700 font-bold bg-white px-1.5 py-0.2 rounded border">
                          {formatRawVND(chickenPrice)}
                        </span>
                      </div>
                      <input
                        type="range"
                        min={160000}
                        max={250000}
                        step={5000}
                        value={chickenPrice}
                        onChange={(e) => setChickenPrice(Number(e.target.value))}
                        className="w-full h-2 bg-slate-200 rounded appearance-none cursor-pointer accent-emerald-600"
                      />
                      <div className="flex justify-between text-[10px] text-slate-400">
                        <span>160k (Sỉ)</span>
                        <span className="font-semibold text-slate-600">200k (Lẻ chuẩn)</span>
                        <span>250k (Biếu Tết)</span>
                      </div>
                    </div>

                    {/* Slider Lợn */}
                    <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-200 space-y-1">
                      <div className="flex justify-between text-xs font-semibold text-slate-700">
                        <span>🐷 Giá lợn hơi / kg:</span>
                        <span className="text-emerald-700 font-bold bg-white px-1.5 py-0.2 rounded border">
                          {formatRawVND(pigPrice)}
                        </span>
                      </div>
                      <input
                        type="range"
                        min={100000}
                        max={160000}
                        step={5000}
                        value={pigPrice}
                        onChange={(e) => setPigPrice(Number(e.target.value))}
                        className="w-full h-2 bg-slate-200 rounded appearance-none cursor-pointer accent-emerald-600"
                      />
                      <div className="flex justify-between text-[10px] text-slate-400">
                        <span>100k/kg (Thấp)</span>
                        <span className="font-semibold text-slate-600">130k/kg (Trung bình)</span>
                        <span>160k/kg (Sốt Tết)</span>
                      </div>
                    </div>

                    {/* Slider Chuối Men */}
                    <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-200 space-y-1">
                      <div className="flex justify-between text-xs font-semibold text-slate-700">
                        <span>🌱 Tiết kiệm thức ăn từ chuối:</span>
                        <span className="text-amber-700 font-bold bg-white px-1.5 py-0.2 rounded border">
                          {Math.round(feedSavingRate * 100)}%
                        </span>
                      </div>
                      <input
                        type="range"
                        min={0}
                        max={0.60}
                        step={0.05}
                        value={feedSavingRate}
                        onChange={(e) => setFeedSavingRate(Number(e.target.value))}
                        className="w-full h-2 bg-slate-200 rounded appearance-none cursor-pointer accent-amber-600"
                      />
                      <div className="flex justify-between text-[10px] text-slate-400">
                        <span>0% (Cám 100%)</span>
                        <span className="font-semibold text-amber-700">40% (Chuẩn men)</span>
                        <span>60% (Tối đa)</span>
                      </div>
                    </div>
                  </div>

                  <div className="bg-emerald-50 rounded-xl p-2.5 border border-emerald-200 text-xs space-y-1">
                    <div className="flex justify-between font-bold text-slate-900">
                      <span>Doanh thu mô phỏng:</span>
                      <span className="text-emerald-700">{formatVND(totalRevenue, 1)}</span>
                    </div>
                    <div className="flex justify-between font-bold text-slate-900">
                      <span>Lợi nhuận ròng:</span>
                      <span className="text-emerald-700">+{formatVND(totalNetProfit, 1)} (ROI {roi.toFixed(1)}%)</span>
                    </div>
                  </div>
                </div>

                {/* Chart */}
                <div className="bg-white rounded-2xl shadow-sm border border-slate-200/90 p-3.5 sm:p-5 space-y-3">
                  <div className="flex justify-between items-center border-b border-slate-100 pb-2.5">
                    <div>
                      <h3 className="text-xs sm:text-sm font-bold text-slate-900 flex items-center gap-1.5">
                        <i data-lucide="bar-chart-3" className="w-4 h-4 text-emerald-600"></i>
                        Đồ Thị Phân Tích
                      </h3>
                      <p className="text-[10px] text-slate-500">So sánh trực quan các dòng mục</p>
                    </div>

                    <div className="flex items-center gap-1 bg-slate-100 p-0.5 rounded text-[11px] font-semibold">
                      <button
                        onClick={() => setActiveChartTab('flow')}
                        className={`px-2 py-0.5 rounded ${activeChartTab === 'flow' ? 'bg-white text-emerald-800 shadow' : 'text-slate-600'}`}
                      >
                        Dòng tiền
                      </button>
                      <button
                        onClick={() => setActiveChartTab('costs')}
                        className={`px-2 py-0.5 rounded ${activeChartTab === 'costs' ? 'bg-white text-emerald-800 shadow' : 'text-slate-600'}`}
                      >
                        Cơ cấu
                      </button>
                      <button
                        onClick={() => setActiveChartTab('comparison')}
                        className={`px-2 py-0.5 rounded ${activeChartTab === 'comparison' ? 'bg-white text-emerald-800 shadow' : 'text-slate-600'}`}
                      >
                        So sánh
                      </button>
                    </div>
                  </div>

                  <div className="relative h-60 w-full">
                    <canvas ref={chartRef}></canvas>
                  </div>
                </div>
              </div>
            </section>

            {/* 6. CHECKLIST HẠ TẦNG 40M & PHÂN TÍCH ĐIỀU HÀNH */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-3 sm:gap-4 items-start pt-1">
              {/* Capex Checklist */}
              <div className="bg-white rounded-2xl shadow-sm border border-slate-200/90 p-3.5 sm:p-5 space-y-3">
                <div className="border-b border-slate-100 pb-2 flex justify-between items-center">
                  <div>
                    <h3 className="text-xs sm:text-sm font-bold text-slate-900 flex items-center gap-1.5">
                      <i data-lucide="wrench" className="w-4 h-4 text-emerald-600"></i>
                      Checklist Hạ Tầng & Thiết Bị (~40 Triệu)
                    </h3>
                    <p className="text-[10px] text-slate-500">Nghiệm thu trong tuần đầu khởi động</p>
                  </div>
                  <span className="text-[11px] font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">
                    {completedCapexCount}/{capexItems.length} xong
                  </span>
                </div>

                <div className="space-y-1.5 max-h-72 overflow-y-auto pr-1">
                  {capexItems.map((item) => (
                    <div
                      key={item.id}
                      onClick={() => toggleCapex(item.id)}
                      className={`p-2 rounded-xl border flex items-start gap-2 cursor-pointer transition touch-manipulation ${
                        item.completed ? "bg-slate-50 border-slate-200" : "bg-white border-amber-200"
                      }`}
                    >
                      <input
                        type="checkbox"
                        checked={item.completed}
                        onChange={() => {}}
                        className="mt-0.5 accent-emerald-600 w-3.5 h-3.5 cursor-pointer"
                      />
                      <div className="flex-1 min-w-0">
                        <div className="flex justify-between items-center">
                          <span className="text-xs font-bold text-slate-800 leading-tight">{item.name}</span>
                          <span className="text-xs font-black text-emerald-700 whitespace-nowrap ml-1">{formatVND(item.cost, 1)}</span>
                        </div>
                        <p className="text-[10px] text-slate-500 truncate">{item.note}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {/* Strategic Insights */}
              <div className="bg-white rounded-2xl shadow-sm border border-slate-200/90 p-3.5 sm:p-5 space-y-3">
                <div className="border-b border-slate-100 pb-2">
                  <h3 className="text-xs sm:text-sm font-bold text-slate-900 flex items-center gap-1.5">
                    <i data-lucide="lightbulb" className="w-4 h-4 text-amber-600"></i>
                    Luận Điểm Chiến Lược Vụ Tết
                  </h3>
                  <p className="text-[10px] text-slate-500">Giải trình điểm cân bằng vàng 130M</p>
                </div>

                <div className="space-y-2 text-xs">
                  <div className="p-3 rounded-xl bg-emerald-50/60 border border-emerald-200 space-y-1">
                    <h4 className="font-bold text-emerald-900 flex items-center gap-1 text-xs">
                      <i data-lucide="star" className="w-3.5 h-3.5 text-emerald-600"></i>
                      Tại sao Gói 130M là Điểm Cân Bằng Vàng?
                    </h4>
                    <p className="text-slate-700 text-[11px] leading-relaxed">
                      Khai thác tối đa 100% công suất của nhóm 4 người trong 100 ngày. Thu về 147 triệu tiền mặt trước 28 Tết (dôi dư 17 triệu tiền tươi sau khi hoàn 100% vốn gốc), đồng thời sở hữu nguyên vẹn 285 gà giò và 32 triệu tài sản máy móc.
                    </p>
                  </div>

                  <div className="p-3 rounded-xl bg-blue-50/60 border border-blue-200 space-y-1">
                    <h4 className="font-bold text-blue-900 flex items-center gap-1 text-xs">
                      <i data-lucide="check-circle-2" className="w-3.5 h-3.5 text-blue-600"></i>
                      Đột phá giống gà 1 tháng chỉ 12.000đ/con
                    </h4>
                    <p className="text-slate-700 text-[11px] leading-relaxed">
                      Chi phí con giống gối đầu giảm tới gần 70% (chỉ còn 2.4M - 4.8M). Khoản dôi dư được chuyển trọn vẹn vào quỹ dự phòng thức ăn và thuốc thú y, đảm bảo an toàn tuyệt đối.
                    </p>
                  </div>
                </div>
              </div>
            </div>
          </main>

          {/* Footer */}
          <footer className="mt-6 border-t border-slate-200 bg-white py-5 text-slate-500 text-xs text-center">
            <div className="max-w-7xl mx-auto px-4 space-y-1">
              <div className="font-bold text-slate-800">
                Trang Trại Hữu Cơ Bán Tự Nhiên • Kế Hoạch Tài Chính & Vận Hành Vụ Tết
              </div>
              <p className="text-[11px] text-slate-400">
                Thiết kế tối ưu hiển thị hoàn hảo trên mọi kích thước màn hình điện thoại & máy tính
              </p>
            </div>
          </footer>

          {/* Glossary Modal */}
          {showGlossary && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-3">
              <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-4 space-y-3 max-h-[85vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-bold text-sm text-slate-900 flex items-center gap-1.5">
                    <i data-lucide="book-open" className="w-4 h-4 text-emerald-600"></i>
                    Thuật Ngữ Tài Chính Nông Nghiệp
                  </h3>
                  <button onClick={() => setShowGlossary(false)} className="text-slate-400 hover:text-slate-700">
                    <i data-lucide="x" className="w-4 h-4"></i>
                  </button>
                </div>

                <div className="space-y-2 text-xs">
                  <div className="bg-slate-50 p-2.5 rounded-lg border border-slate-200">
                    <strong className="text-emerald-800 block mb-0.5">1. Tiền Mặt Cầm Về (Cash Profit):</strong>
                    Doanh thu bán Tết - Tổng vốn ban đầu. Thể hiện lượng tiền mặt rút về sau khi hoàn trả 100% vốn gốc.
                  </div>
                  <div className="bg-slate-50 p-2.5 rounded-lg border border-slate-200">
                    <strong className="text-emerald-800 block mb-0.5">2. Tài Sản Tích Lũy Sau Tết:</strong>
                    (Đàn gà 1T × 95% sống × 130.000đ khi lên giò 4.5 tháng) + 32 triệu thiết bị sau khấu hao 20%.
                  </div>
                  <div className="bg-slate-50 p-2.5 rounded-lg border border-slate-200">
                    <strong className="text-emerald-800 block mb-0.5">3. Lợi Nhuận Ròng Kinh Tế (Net Profit):</strong>
                    Tiền mặt thuần + Giá trị tài sản sau Tết. Thước đo thực chất mức gia tăng của trang trại.
                  </div>
                </div>

                <div className="text-right pt-1 border-t">
                  <button
                    onClick={() => setShowGlossary(false)}
                    className="px-3 py-1.5 bg-emerald-700 text-white rounded-lg text-xs font-bold"
                  >
                    Đóng
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
